<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Larpenator "signature" mark: a hand-drawn L and a dot on a dark navy glass tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a40"/>
      <stop offset=".45" stop-color="#080d17"/>
      <stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".18" cy=".12" r=".6">
      <stop offset="0" stop-color="#3d6694" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3d6694" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx=".95" cy=".95" r=".35">
      <stop offset="0" stop-color="#2f6fd0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#4a7db8" stop-opacity=".4"/>
      <stop offset=".7" stop-color="#223a5a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3f7fd6" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e6f0ff"/>
      <stop offset="1" stop-color="#9fcbff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="1000" height="1000" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="1000" fill="url(#tile)"/>
    <rect width="1000" height="1000" fill="url(#sheen)"/>
    <rect width="1000" height="1000" fill="url(#corner)"/>
  </g>
  <rect x="3" y="3" width="994" height="994" rx="183" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <!-- glow under the stroke -->
  <g filter="url(#glow)" opacity=".5">
    <path d="M643 175 C 520 335, 300 600, 160 832 C 300 722, 505 612, 725 597" fill="none" stroke="#3f8cff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="822" cy="607" rx="28" ry="22" fill="#3f8cff"/>
  </g>
  <!-- the signature -->
  <g filter="url(#soft)">
    <path d="M643 175 C 520 335, 300 600, 160 832" fill="none" stroke="url(#ink)" stroke-width="29" stroke-linecap="round"/>
    <path d="M160 832 C 300 722, 505 612, 725 597" fill="none" stroke="url(#ink)" stroke-width="27" stroke-linecap="round"/>
    <path d="M160 832 C 300 722, 505 612, 725 597" fill="none" stroke="#bfe0ff" stroke-width="9" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="822" cy="607" rx="25" ry="18" transform="rotate(-25 822 607)" fill="#8fc6ff"/>
  </g>
</svg>
